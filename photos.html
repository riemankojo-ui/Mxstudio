        } 

        function buildFontGrid() {
            let gridContainer = document.getElementById('fontGridContainer');
            let html = '';
            fontList.forEach(fontName => {
                let activeClass = (fontName === 'Impact') ? 'selected' : '';
                html += `<div class="effect-card ${activeClass}" style="font-family:'${fontName}'" onclick="setActiveFont('${fontName}', this)">${fontName}</div>`;
            });
            gridContainer.innerHTML = html;
        }

        function goHome() {
            document.getElementById('view-studio').classList.remove('active');
            document.getElementById('view-home').classList.add('active');
            textMenu.style.display = 'none';
            renderProjectsList();
        } 

        function startNewProject() {
            currentProjectId = 'proj_' + Date.now();
            imgLoaded = false;
            currentFilter = 'none';
            currentEffect = 'none';
            bInput.value = 100; cInput.value = 100; sInput.value = 100; nInput.value = 0; eInput.value = 70;
            
            textLayers = [
                { id: Date.now(), text: "MUSIC ALBUM", x: 200, y: 200, font: "Impact", size: 36, color: "#ffffff", style: "normal" }
            ];
            activeLayerId = textLayers[0].id;
            syncActiveInputs();
            updateTextLayersUI();

            fxX = 200; fxY = 200;
            undoStack = []; redoStack = []; updateHistoryButtons();
            textMenu.style.display = 'none';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('view-home').classList.remove('active');
            document.getElementById('view-studio').classList.add('active');
        } 

        function renderProjectsList() {
            let listContainer = document.getElementById('projects-list');
            let keys = Object.keys(localStorage).filter(k => k.startsWith('music_proj_'));
            
            if (keys.length === 0) {
                listContainer.innerHTML = `<div class="project-card"><div class="project-info"><h4>No Saved Projects</h4><p>Tap '+ New Project' to get started</p></div></div>`;
                return;
            } 

            let html = '';
            keys.sort().reverse().forEach(key => {
                let projData = JSON.parse(localStorage.getItem(key));
                html += `
                    <div class="project-card">
                        <div class="project-info">
                            <h4>${projData.name}</h4>
                            <p>Saved: ${projData.date}</p>
                        </div>
                        <div class="project-actions">
                            <button class="open-proj-btn" onclick="loadProject('${key}')">Open</button>
                            <button class="delete-proj-btn" onclick="deleteProject('${key}')">🗑️</button>
                        </div>
                    </div>`;
            });
            listContainer.innerHTML = html;
        } 

        function loadProject(key) {
            let projData = JSON.parse(localStorage.getItem(key));
            currentProjectId = key.replace('music_', '');
            
            if (projData.textLayers) {
                textLayers = projData.textLayers;
                if (textLayers.length > 0) activeLayerId = textLayers[0].id;
            }
            syncActiveInputs();
            updateTextLayersUI();

            img.onload = function() { imgLoaded = true; saveState(); redraw(); }
            img.src = projData.image;
            document.getElementById('view-home').classList.remove('active');
            document.getElementById('view-studio').classList.add('active');
        } 

        function deleteProject(key) {
            if (confirm("Delete this saved project?")) {
                localStorage.removeItem(key);
                renderProjectsList();
            }
        } 

        upload.addEventListener('change', function(e) {
            if (!e.target.files || e.target.files.length === 0) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                img.onload = function() {
                    canvas.width = 400;
                    canvas.height = 400;
                    fxX = 200; fxY = 200;
                    imgLoaded = true;
                    undoStack = []; redoStack = [];
                    textMenu.style.display = 'none';
                    saveState();
                    redraw();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }); 

        function saveState() {
            if (!imgLoaded) return;
            let currentState = canvas.toDataURL();
            if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== currentState) {
                undoStack.push(currentState);
                if (undoStack.length > 15) undoStack.shift();
                redoStack = [];
                updateHistoryButtons();
            }
        } 

        function undo() {
            if (undoStack.length > 1) {
                let currentState = undoStack.pop();
                redoStack.push(currentState);
                let prevState = undoStack[undoStack.length - 1];
                let tempImg = new Image();
                tempImg.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(tempImg, 0, 0);
                    updateHistoryButtons();
                }
                tempImg.src = prevState;
            }
        } 

        function redo() {
            if (redoStack.length > 0) {
                let nextState = redoStack.pop();
                undoStack.push(nextState);
                let tempImg = new Image();
                tempImg.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(tempImg, 0, 0);
                    updateHistoryButtons();
                }
                tempImg.src = nextState;
            }
        } 

        function updateHistoryButtons() {
            document.getElementById('undoBtn').disabled = undoStack.length <= 1;
            document.getElementById('redoBtn').disabled = redoStack.length === 0;
        } 

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        } 

        canvas.addEventListener('mousedown', startTouch);
        canvas.addEventListener('touchstart', startTouch, {passive: true});
        canvas.addEventListener('mousemove', onTouchMove);
        canvas.addEventListener('touchmove', onTouchMove, {passive: true});
        canvas.addEventListener('mouseup', endTouch);
        canvas.addEventListener('touchend', endTouch); 

        function startTouch(e) {
            if (!imgLoaded) return;
            const pos = getCanvasCoordinates(e);
            
            let clickedLayer = null;
            for (let layer of textLayers) {
                ctx.font = `bold ${layer.size}px '${layer.font}', sans-serif`;
                let metrics = ctx.measureText(layer.text);
                let tWidth = metrics.width;
                let tHeight = parseInt(layer.size); 

                if (pos.x >= layer.x - tWidth/2 - 20 && pos.x <= layer.x + tWidth/2 + 20 &&
                    pos.y >= layer.y - tHeight && pos.y <= layer.y + 15) {
                    clickedLayer = layer;
                    break;
                }
            }

            if (clickedLayer) {
                activeLayerId = clickedLayer.id;
                syncActiveInputs();
                updateTextLayersUI();
                isDraggingText = true;
                showFloatingMenu(clickedLayer.x, clickedLayer.y);
            } else {
                textMenu.style.display = 'none'; 
                isDraggingFx = true;
                fxX = pos.x;
                fxY = pos.y;
                redraw();
            }
        } 

        function onTouchMove(e) {
            if (!imgLoaded) return;
            const pos = getCanvasCoordinates(e);
            if (isDraggingText) {
                let layer = textLayers.find(l => l.id === activeLayerId);
                if (layer) {
                    layer.x = pos.x;
                    layer.y = pos.y;
                    showFloatingMenu(layer.x, layer.y);
                    redraw();
                }
            } else if (isDraggingFx) {
                fxX = pos.x;
                fxY = pos.y;
                redraw();
            }
        } 

        function endTouch() {
            if (isDraggingText || isDraggingFx) {
                isDraggingText = false;
                isDraggingFx = false;
                saveState();
            }
        } 

        function showFloatingMenu(x, y) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = rect.width / canvas.width;
            const scaleY = rect.height / canvas.height; 

            textMenu.style.left = (x * scaleX) + 'px';
            textMenu.style.top = ((y * scaleY) - 30) + 'px';
            textMenu.style.display = 'block';
        } 

        function moveActiveText(dx, dy) {
            let layer = textLayers.find(l => l.id === activeLayerId);
            if (layer) {
                layer.x += dx;
                layer.y += dy;
                showFloatingMenu(layer.x, layer.y);
                redraw();
                saveState();
            }
        } 

        function centerActiveTextHoriz() {
            let layer = textLayers.find(l => l.id === activeLayerId);
            if (layer) {
                layer.x = canvas.width / 2;
                showFloatingMenu(layer.x, layer.y);
                redraw();
                saveState();
            }
        } 

        function addNewTextLayer() {
            let newId = Date.now();
            let newLayer = {
                id: newId,
                text: "NEW TEXT",
                x: 200,
                y: 250,
                font: "Impact",
                size: 32,
                color: "#ffffff",
                style: "normal"
            };
            textLayers.push(newLayer);
            activeLayerId = newId;
            syncActiveInputs();
            updateTextLayersUI();
            showFloatingMenu(newLayer.x, newLayer.y);
            redraw();
            saveState();
        }

        function deleteActiveTextLayer() {
            if (textLayers.length <= 1) {
                let layer = textLayers.find(l => l.id === activeLayerId);
                if (layer) layer.text = '';
            } else {
                textLayers = textLayers.filter(l => l.id !== activeLayerId);
                activeLayerId = textLayers[0].id;
            }
            textMenu.style.display = 'none';
            syncActiveInputs();
            updateTextLayersUI();
            redraw();
            saveState();
        }

        function selectLayer(id) {
            activeLayerId = id;
            syncActiveInputs();
            updateTextLayersUI();
            let layer = textLayers.find(l => l.id === id);
            if (layer) {
                showFloatingMenu(layer.x, layer.y);
            }
        }

        function updateTextLayersUI() {
            let listEl = document.getElementById('textLayersList');
            if (!listEl) return;
            let html = '';
            textLayers.forEach(l => {
                let isActive = l.id === activeLayerId ? 'active' : '';
                html += `
                    <div class="text-layer-item ${isActive}" onclick="selectLayer(${l.id})">
                        <span style="font-weight:bold; font-size:11px;">${l.text || '(Empty)'}</span>
                        <span style="font-size:10px; color:#aaa;">${l.font}</span>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function syncActiveInputs() {
            let layer = textLayers.find(l => l.id === activeLayerId);
            if (!layer) return;
            tInput.value = layer.text;
            sizeInput.value = layer.size;
            document.getElementById('fSizeVal').innerText = layer.size;
        }

        function updateActiveTextContent(val) {
            let layer = textLayers.find(l => l.id === activeLayerId);
            if (layer) {
                layer.text = val;
                updateTextLayersUI();
                redraw();
                saveState();
            }
        }

        function setActiveFontSize(val) {
            let layer = textLayers.find(l => l.id === activeLayerId);
            if (layer) {
                layer.size = parseInt(val);
                document.getElementById('fSizeVal').innerText = val;
                redraw();
                saveState();
            }
        }

        function setActiveFont(fontName, el) {
            let layer = textLayers.find(l => l.id === activeLayerId);
            if (layer) {
                layer.font = fontName;
                updateSelection(el);
                redraw();
                saveState();
            }
        }

        function setActiveTextColor(hex, el) {
            let layer = textLayers.find(l => l.id === activeLayerId);
            if (layer) {
                layer.color = hex;
                updateSelection(el);
                redraw();
                saveState();
            }
        }

        function setActiveTextStyle(style, el) {
            let layer = textLayers.find(l => l.id === activeLayerId);
            if (layer) {
                layer.style = style;
                updateSelection(el);
                redraw();
                saveState();
            }
        }

        function saveProjectToHome() {
            if (!imgLoaded) { alert("Upload an image first!"); return; }
            if (!currentProjectId) currentProjectId = 'proj_' + Date.now();
            let projName = prompt("Project Name:", "Cover Art " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
            if (!projName) return; 

            let projInfo = { 
                name: projName, 
                date: new Date().toLocaleDateString(), 
                image: canvas.toDataURL('image/png'),
                textLayers: textLayers
            };
            localStorage.setItem('music_' + currentProjectId, JSON.stringify(projInfo));
            alert("Project saved successfully!");
            goHome();
        } 

        function switchPanel(name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');
            event.currentTarget.classList.add('active');
        } 

        function switchSubTab(name, el) {
            document.querySelectorAll('.sub-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('subtab-' + name).classList.add('active');
            el.classList.add('active');
        } 

        function setFilter(code, el) { currentFilter = code; updateSelection(el); saveState(); redraw(); }
        function setEffect(name, el) { currentEffect = name; updateSelection(el); saveState(); redraw(); }

        function updateSelection(el) {
            let parent = el.parentElement;
            parent.querySelectorAll('.effect-card, .color-circle').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        } 

        function saveImage() {
            if (!imgLoaded) { alert("No image to download!"); return; }
            let link = document.createElement('a');
            link.download = 'music-cover.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        } 

        [bInput, cInput, sInput, nInput, eInput].forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('bVal').innerText = bInput.value;
                document.getElementById('cVal').innerText = cInput.value;
                document.getElementById('sVal').innerText = sInput.value;
                document.getElementById('nVal').innerText = nInput.value;
                document.getElementById('eVal').innerText = eInput.value;
                redraw();
            });
            input.addEventListener('change', () => { saveState(); });
        }); 

        function redraw() {
            if (!imgLoaded) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            let filterString = `brightness(${bInput.value}%) contrast(${cInput.value}%) saturate(${sInput.value}%) `;
            if (currentFilter !== 'none') filterString += currentFilter;
            ctx.filter = filterString;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none'; 

            let fadeVal = parseInt(nInput.value);
            if (fadeVal > 0) {
                ctx.save();
                ctx.fillStyle = `rgba(0, 0, 0, ${(fadeVal / 100) * 0.4})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            } 

            let alpha = eInput.value / 100;
            if (currentEffect === 'warm') {
                ctx.save();
                let grad = ctx.createRadialGradient(fxX, fxY, 10, fxX, fxY, canvas.width * 0.7);
                grad.addColorStop(0, `rgba(255, 90, 0, ${alpha})`);
                grad.addColorStop(0.5, `rgba(255, 30, 0, ${alpha * 0.5})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            } else if (currentEffect === 'cyber') {
                ctx.save();
                let grad = ctx.createRadialGradient(fxX, fxY, 10, fxX, fxY, canvas.width * 0.7);
                grad.addColorStop(0, `rgba(0, 220, 255, ${alpha})`);
                grad.addColorStop(0.5, `rgba(100, 0, 255, ${alpha * 0.5})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            } else if (currentEffect === 'emerald') {
                ctx.save();
                let grad = ctx.createRadialGradient(fxX, fxY, 10, fxX, fxY, canvas.width * 0.7);
                grad.addColorStop(0, `rgba(0, 255, 150, ${alpha})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            } else if (currentEffect === 'purple') {
                ctx.save();
                let grad = ctx.createRadialGradient(fxX, fxY, 10, fxX, fxY, canvas.width * 0.7);
                grad.addColorStop(0, `rgba(200, 50, 255, ${alpha})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            } else if (currentEffect === 'vignette') {
                ctx.save();
                let gradient = ctx.createRadialGradient(fxX, fxY, 40, fxX, fxY, canvas.width);
                gradient.addColorStop(0, 'rgba(0,0,0,0)');
                gradient.addColorStop(1, `rgba(0,0,0,${alpha})`);
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            } else if (currentEffect === 'glitch') {
                ctx.save();
                ctx.fillStyle = `rgba(0, 255, 255, ${alpha * 0.15})`;
                for (let i = 0; i < canvas.height; i += 4) {
                    ctx.fillRect(0, i, canvas.width, 1);
                }
                ctx.restore();
            } else if (currentEffect === 'stars') {
                ctx.save();
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                for (let i = 0; i < 40; i++) {
                    let sx = (i * 37) % canvas.width;
                    let sy = (i * 73) % canvas.height;
                    ctx.fillRect(sx, sy, 2, 2);
                }
                ctx.restore();
            } else if (currentEffect === 'bokeh') {
                ctx.save();
                ctx.fillStyle = `rgba(255, 220, 150, ${alpha * 0.4})`;
                ctx.beginPath();
                ctx.arc(fxX - 40, fxY - 30, 25, 0, Math.PI * 2);
                ctx.arc(fxX + 50, fxY + 40, 35, 0, Math.PI * 2);
                ctx.arc(fxX - 20, fxY + 60, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            textLayers.forEach(layer => {
                if (layer.text && layer.text.trim() !== '') {
                    ctx.save();
                    ctx.font = `bold ${layer.size}px '${layer.font}', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle'; 

                    if (layer.style === 'stroke') {
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = '#000000';
                        ctx.strokeText(layer.text, layer.x, layer.y);
                    } else if (layer.style === 'shadow') {
                        ctx.shadowColor = 'rgba(0,0,0,0.9)';
                        ctx.shadowBlur = 12;
                        ctx.shadowOffsetX = 4;
                        ctx.shadowOffsetY = 4;
                    } 

                    ctx.fillStyle = layer.color;
                    ctx.fillText(layer.text, layer.x, layer.y);
                    ctx.restore();
                }
            });
        }
